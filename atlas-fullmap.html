<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ATLAS // OSINT Map</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--bg:#070b10;--p2:#111b26;--ln:#1e2c3b;--tx:#d8e3ef;--mu:#6e8398;--ac:#37d6c8;--c0:#f5a524;--c1:#4cc2ff;--c2:#b08cff;--c3:#6ee7a0;--red:#ff5d6c;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:13px/1.45 "IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
button,input{font:inherit}
button{background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:4px;padding:6px 9px;cursor:pointer;font-family:var(--mono);font-size:11px;letter-spacing:.03em}
button:hover{border-color:var(--ac);color:var(--ac)}
button.pri{background:var(--ac);color:#04201d;border-color:var(--ac);font-weight:600}
button.pri:hover{color:#04201d;filter:brightness(1.1)}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.mu{color:var(--mu);margin:0}
#map{position:fixed;inset:0;background:#0a1118}
.hud,.card{background:#0b121bdd;backdrop-filter:blur(8px);border:1px solid var(--ln);border-radius:8px;box-shadow:0 10px 30px #0009}
.hud{position:fixed;z-index:1000}
.hd{font:600 10px var(--mono);letter-spacing:.14em;color:var(--mu);margin-bottom:9px;display:flex;gap:6px;align-items:center}
.hd:before{content:"";width:3px;height:10px;background:var(--ac)}
.hd span{margin-left:auto;color:var(--ac)}
/* top-left: search + locations */
.tl{top:12px;left:12px;width:330px;max-height:calc(100% - 24px);display:flex;flex-direction:column;padding:12px}
.sbox{position:relative;display:flex;gap:6px}
input{flex:1;min-width:0;background:#080d13;color:var(--tx);border:1px solid var(--ln);border-radius:4px;padding:8px 10px;font-family:var(--mono);font-size:12px}
.sug{position:absolute;top:100%;left:0;right:0;margin-top:4px;z-index:30;background:var(--p2);border:1px solid var(--ln);border-radius:4px;box-shadow:0 12px 30px #000a;overflow:hidden}
.sug div{display:flex;justify-content:space-between;gap:8px;padding:7px 10px;cursor:pointer;font-size:12px}
.sug div:hover,.sug div.on{background:#172433}.sug small{color:var(--mu);font:10px var(--mono)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:9px 0 12px}
.chip{padding:3px 9px;font-size:10px;border-radius:99px}.chip.on{border-color:var(--ac);color:var(--ac);background:#0f2a2b}
#list{flex:1;min-height:0;max-height:300px;overflow:auto}
.it{display:flex;align-items:center;gap:9px;padding:6px 7px;border-radius:4px;cursor:pointer;border:1px solid transparent}
.it:hover,.it.on{background:var(--p2);border-color:var(--ln)}
.it i{width:9px;height:9px;border-radius:50%;flex:none}
.it div{min-width:0;flex:1}.it b{display:block;font-weight:500;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it small{color:var(--mu);font:10px var(--mono)}
.rk{font:600 9px var(--mono);letter-spacing:.06em;font-style:normal}
.rk.LOW{color:var(--c3)}.rk.MED{color:var(--c0)}.rk.HIGH{color:var(--red)}
.tools{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px}
.tools button{padding:6px 4px}
/* top-center: brand + KPIs */
.tc{top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:16px;padding:7px 14px}
.brand{font:600 13px var(--mono);letter-spacing:.14em}.brand b{color:var(--ac)}.brand span{color:var(--mu);font-weight:400}
.cls{font:600 9px var(--mono);letter-spacing:.12em;color:#04201d;background:var(--c3);padding:2px 7px;border-radius:2px}
.clock{font:11px var(--mono);color:var(--mu)}
.kp{display:flex;gap:5px;align-items:baseline;font:600 9px var(--mono);letter-spacing:.1em;color:var(--mu)}
.kp b{font:500 15px var(--mono);color:var(--ac);letter-spacing:0}.kp.warn b{color:var(--red)}
/* right: four floating cards */
.cards{position:fixed;z-index:1000;top:64px;right:12px;bottom:44px;width:310px;display:flex;flex-direction:column;gap:10px;overflow:auto;pointer-events:none;scrollbar-width:none}
.cards::-webkit-scrollbar{display:none}
.card{pointer-events:auto;flex:none;padding:12px 14px}
.card.in{animation:in .28s both}.card.in:nth-child(2){animation-delay:.06s}.card.in:nth-child(3){animation-delay:.12s}.card.in:nth-child(4){animation-delay:.18s}
@keyframes in{from{opacity:0;transform:translateX(16px)}}
h2{font-size:18px;margin:0 0 7px;letter-spacing:-.01em}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tg{font:10px var(--mono);border:1px solid var(--ln);background:var(--p2);color:#b5c6d8;padding:2px 7px;border-radius:3px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.x{padding:0 7px;line-height:18px;font-size:11px}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.mc{border:1px solid var(--ln);background:#0a1118;border-radius:4px;padding:7px 9px;min-width:0}
.mc span{display:block;font:600 9px var(--mono);letter-spacing:.12em;color:var(--mu);margin-bottom:3px}
.mc b{font:500 12px var(--mono);overflow-wrap:anywhere}
.bar{height:5px;background:#1a2736;border-radius:3px;margin-bottom:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.rels{display:flex;gap:6px;flex-wrap:wrap}
.rel{display:flex;gap:7px;align-items:center;font-family:inherit;font-size:11px;padding:5px 8px}
.rel small{color:var(--mu);font:10px var(--mono)}.rel.on{border-color:#2a6b66;background:#0f2a2b}
#log div{font:11px/1.5 var(--mono);padding:4px 0;border-bottom:1px dashed var(--ln);color:#b9c9da}
#log time{color:var(--ac);margin-right:8px}
/* bottom-center: legend + coords */
.bc{bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:14px;padding:6px 12px;font:10px var(--mono);color:#a9bacb;white-space:nowrap}
.bc span{display:flex;gap:5px;align-items:center}.bc i{width:8px;height:8px;border-radius:50%}
/* map bits */
.mk{width:14px;height:14px;border-radius:50%;background:currentColor;border:2px solid #05080c;box-shadow:0 0 0 2px currentColor,0 0 12px currentColor;margin:3px}
.mk.rt{width:18px;height:18px;margin:1px}.mk.sel{transform:scale(1.35);box-shadow:0 0 0 3px #fff,0 0 16px currentColor}
.leaflet-tooltip{position:absolute;white-space:nowrap;pointer-events:none;background:#0a1118ee;color:var(--tx);border:1px solid var(--ln);border-radius:3px;padding:2px 7px;font:11px var(--mono);box-shadow:none}
.leaflet-tooltip.lbl:before{display:none}
.leaflet-bar a{display:block;width:28px;height:28px;line-height:28px;text-align:center;background:var(--p2);color:var(--tx);text-decoration:none;border-bottom:1px solid var(--ln)}
.leaflet-bar{border:1px solid var(--ln);border-radius:4px;overflow:hidden}
.leaflet-control-layers{background:var(--p2);color:var(--tx);border:1px solid var(--ln);border-radius:4px;font:10px var(--mono)}
.leaflet-control-layers-toggle{display:block;width:34px;height:34px;line-height:34px;text-align:center;cursor:pointer}
.leaflet-control-layers-toggle:before{content:"◫";font-size:18px}
.leaflet-control-layers-list{display:none}
.leaflet-control-layers-expanded{padding:6px 10px}
.leaflet-control-layers-expanded .leaflet-control-layers-list{display:block}
.leaflet-control-layers-expanded .leaflet-control-layers-toggle{display:none}
.leaflet-control-layers label{display:block;cursor:pointer}.leaflet-control-layers-selector{margin-right:6px}.leaflet-control-layers-separator{display:none}
.leaflet-control-attribution{background:#0a1118cc;color:#7d90a5;font-size:9px;padding:0 5px}.leaflet-control-attribution a{color:#9db8d6}
@media(max-width:1180px){.cls,.clock{display:none}}
@media(max-width:760px){.tc{display:none}.tl{width:calc(100% - 24px)}#list{max-height:110px}.cards{top:auto;bottom:44px;left:12px;right:12px;width:auto;max-height:40%;flex-direction:row}.card{flex:0 0 270px;overflow:auto}.bc{display:none}}
/* minimal Leaflet core CSS */
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-tile-container,.leaflet-zoom-box,.leaflet-map-pane svg,.leaflet-overlay-pane svg{position:absolute;left:0;top:0}
.leaflet-container{overflow:hidden;outline:0;-webkit-tap-highlight-color:transparent}
.leaflet-tile,.leaflet-marker-icon{user-select:none;-webkit-user-drag:none}
.leaflet-tile{visibility:hidden}.leaflet-tile-loaded{visibility:inherit}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-zoom-anim .leaflet-zoom-animated{transition:transform .25s cubic-bezier(0,0,.25,1)}
.leaflet-zoom-anim .leaflet-tile,.leaflet-pan-anim .leaflet-tile{transition:none}
.leaflet-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-tooltip-pane{z-index:650}.leaflet-popup-pane{z-index:700}
.leaflet-map-pane canvas{position:absolute}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}
.leaflet-right .leaflet-control{float:right;margin-right:10px}
.leaflet-top .leaflet-control{margin-top:10px}.leaflet-left .leaflet-control{margin-left:10px}.leaflet-bottom .leaflet-control{margin-bottom:10px}
.leaflet-interactive{cursor:pointer}.leaflet-grab{cursor:grab}.leaflet-dragging .leaflet-grab{cursor:grabbing}
.leaflet-marker-icon.leaflet-interactive{pointer-events:auto}
</style>
</head>
<body>
<div id="map"></div>

<div class="hud tl">
  <div class="hd">TARGET SEARCH</div>
  <div class="sbox"><input id="q" placeholder="Search location, e.g. Taxila" autocomplete="off"><button class="pri" id="go">SCAN</button><div id="sug" class="sug" hidden></div></div>
  <div class="chips" id="cats"></div>
  <div class="hd"><b id="lt">SUGGESTED LOCATIONS</b><span id="cnt"></span></div>
  <div id="list"></div>
  <div class="tools"><button id="back">Back to root</button><button id="reroot">Reset to root</button><button id="fit">Fit all</button><button id="exp">Export</button><button id="clear">Clear</button></div>
</div>

<div class="hud tc">
  <div class="brand"><b>◈</b> ATLAS<span>//OSINT</span></div><div class="cls">UNCLASSIFIED // DEMO</div>
  <div id="kp" style="display:flex;gap:16px"></div><div class="clock" id="clock"></div>
</div>

<div class="cards" id="cards"></div>

<div class="hud bc"><span><i style="background:#f5a524"></i>ROOT</span><span><i style="background:#4cc2ff"></i>HOP 1</span><span><i style="background:#b08cff"></i>HOP 2</span><span><i style="background:#6ee7a0"></i>HOP 3+</span><span id="coord">LAT — LON —</span></div>

<script>
'use strict';
// id, name, type, lat, lng, description, [[linkedId, relation]], category
const D=[
["isb","Islamabad","Capital city",33.6844,73.0479,"Planned capital of Pakistan at the foot of the Margalla Hills.",[["faisal","landmark"],["margalla","adjacent to"],["rawal","contains"],["rwp","twin city"],["saidpur","heritage site"]],"Cities"],
["faisal","Faisal Mosque","Landmark",33.7295,73.0372,"Contemporary mosque, one of the largest in South Asia.",[["margalla","sits below"]],"Landmarks"],
["margalla","Margalla Hills","Natural area",33.748,73.075,"Hill range and national park with hiking trails.",[["saidpur","trail to"]],"Nature"],
["rawal","Rawal Lake","Reservoir",33.699,73.123,"Reservoir supplying water to Rawalpindi and Islamabad.",[["rwp","supplies water"]],"Nature"],
["saidpur","Saidpur Village","Heritage site",33.749,73.069,"Restored historic village with cultural sites and eateries.",[],"Landmarks"],
["rwp","Rawalpindi","City",33.5651,73.0169,"Major garrison city, historic bazaars and GT Road hub.",[["taxila","nearby"],["lahore","GT Road"]],"Cities"],
["taxila","Taxila","Archaeological site",33.7463,72.8397,"Ancient Gandhara city and UNESCO World Heritage Site.",[["hazro","nearby"],["tarbela","nearby"]],"Landmarks"],
["hazro","Hazro","Town",33.9094,72.491,"Town in Attock District, Punjab.",[["attock","same district"],["tarbela","nearby"]],"Cities"],
["attock","Attock City","City",33.766,72.3609,"District capital near the Indus and Kabul river confluence.",[["attockfort","contains"],["peshawar","GT Road"]],"Cities"],
["attockfort","Attock Fort","Fort",33.8933,72.243,"Mughal-era fort overlooking the Indus.",[],"Landmarks"],
["tarbela","Tarbela Dam","Dam",34.089,72.698,"Large earth-filled dam on the Indus River.",[],"Landmarks"],
["peshawar","Peshawar","City",34.0151,71.5249,"One of South Asia's oldest living cities near the Khyber Pass.",[],"Cities"],
["lahore","Lahore","City",31.5204,74.3587,"Cultural capital of Punjab, known for historic architecture.",[["badshahi","landmark"],["lahorefort","landmark"],["wagah","border road"]],"Cities"],
["badshahi","Badshahi Mosque","Landmark",31.5882,74.3109,"17th-century Mughal mosque in Lahore.",[["lahorefort","faces"]],"Landmarks"],
["lahorefort","Lahore Fort","Fort",31.5889,74.3147,"Historic citadel in Lahore, UNESCO World Heritage Site.",[],"Landmarks"],
["wagah","Wagah Border","Border crossing",31.604,74.573,"Pakistan-India crossing known for its flag ceremony.",[],"Landmarks"]
];
const $=s=>document.querySelector(s);
const E={},A={};
D.forEach(d=>{E[d[0]]={id:d[0],name:d[1],type:d[2],lat:d[3],lng:d[4],desc:d[5],cat:d[7]};A[d[0]]=[]});
D.forEach(d=>d[6].forEach(([t,r])=>{A[d[0]].push({to:t,rel:r});A[t].push({to:d[0],rel:r})}));
// Demo-only analyst metadata, derived from the id so it stays stable.
const meta=id=>{let h=7;for(const c of id)h=(h*31+c.charCodeAt(0))>>>0;return{risk:['LOW','MED','HIGH'][h%3],conf:60+h%39,src:2+(h>>3)%14,seen:(1+h%28)+'d ago'}};
const HC=['#f5a524','#4cc2ff','#b08cff','#6ee7a0'],col=h=>HC[Math.min(3,h)];
let nodes=new Map(),root=null,sel=null,cat='All',logs=[],lastSel=null;
const log=m=>{logs.unshift({t:new Date().toISOString().slice(11,19),m});logs=logs.slice(0,40)};
const kids=id=>[...nodes].filter(([,v])=>v.parent===id).map(x=>x[0]);
function edges(){const s=new Set(),o=[];nodes.forEach((v,id)=>A[id].forEach(a=>{if(!nodes.has(a.to))return;const k=[id,a.to].sort().join();if(s.has(k))return;s.add(k);o.push([id,a.to,a.rel,Math.max(v.hop,nodes.get(a.to).hop)])}));return o}
function drop(id){kids(id).forEach(k=>{drop(k);nodes.delete(k)})}
function expand(id){const h=nodes.get(id).hop+1;let n=0;A[id].forEach(a=>{if(!nodes.has(a.to)){nodes.set(a.to,{hop:h,parent:id});n++}});if(n)log(`EXPAND ${E[id].name} +${n} linked`)}
const nb=id=>[id,...A[id].map(a=>a.to).filter(t=>nodes.has(t))];
function start(id){root=id;sel=id;nodes.clear();nodes.set(id,{hop:0,parent:null});log(`ROOT SET ${E[id].name}`);expand(id);render(nb(id))}
function pick(id){sel=id;if(!kids(id).length)expand(id);render(nb(id))}
// ---- map
const map=L.map('map',{zoomControl:false}).setView([33.4,72.9],7);
L.control.zoom({position:'bottomleft'}).addTo(map);
const esri=p=>'https://server.arcgisonline.com/ArcGIS/rest/services/'+p+'/MapServer/tile/{z}/{y}/{x}';
const base={'Dark (Esri)':L.tileLayer(esri('Canvas/World_Dark_Gray_Base'),{maxZoom:16,attribution:'Tiles &copy; Esri'}),
 'Streets (Esri)':L.tileLayer(esri('World_Street_Map'),{maxZoom:18,attribution:'Tiles &copy; Esri'}),
 'Satellite (Esri)':L.tileLayer(esri('World_Imagery'),{maxZoom:18,attribution:'Tiles &copy; Esri'}),
 'OpenStreetMap':L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'})};
base['Dark (Esri)'].addTo(map);L.control.layers(base,null,{collapsed:true,position:'topright'}).addTo(map);
const lay=L.layerGroup().addTo(map);
map.on('mousemove',e=>$('#coord').textContent=`LAT ${e.latlng.lat.toFixed(4)}  LON ${e.latlng.lng.toFixed(4)}`);
function rMap(fit){
  lay.clearLayers();
  edges().forEach(([a,b,rel,h])=>L.polyline([[E[a].lat,E[a].lng],[E[b].lat,E[b].lng]],{color:col(h),weight:2.2,opacity:.8,dashArray:'6 6'}).bindTooltip(rel,{sticky:true}).addTo(lay));
  nodes.forEach((v,id)=>{const e=E[id];
    L.marker([e.lat,e.lng],{icon:L.divIcon({className:'',iconSize:[24,24],iconAnchor:[12,12],html:`<div class="mk${id===root?' rt':''}${id===sel?' sel':''}" style="color:${col(v.hop)}"></div>`})})
     .bindTooltip(e.name,{permanent:true,direction:'right',offset:[12,0],className:'lbl'}).on('click',()=>pick(id)).addTo(lay)});
  if(fit&&fit.length)map.fitBounds(L.latLngBounds(fit.map(i=>[E[i].lat,E[i].lng])),{padding:[80,80],maxZoom:11,paddingTopLeft:[360,80],paddingBottomRight:[340,60]});
}
// ---- panels
function kpis(){
  const ids=[...nodes.keys()],hi=ids.filter(i=>meta(i).risk==='HIGH').length,mx=ids.length?Math.max(...[...nodes.values()].map(v=>v.hop)):0;
  $('#kp').innerHTML=[['ENTITIES',ids.length],['LINKS',edges().length],['MAX HOP',mx],['HIGH RISK',hi]].map(([a,b],i)=>`<div class="kp${i===3&&hi?' warn':''}">${a}<b>${b}</b></div>`).join('');
}
function list(){
  if(!nodes.size){
    const r=D.filter(d=>cat==='All'||d[7]===cat).slice(0,6);
    $('#lt').textContent='SUGGESTED LOCATIONS';$('#cnt').textContent=r.length;
    $('#list').innerHTML=r.map(d=>`<div class="it" data-act="start" data-id="${d[0]}"><i style="background:var(--c1)"></i><div><b>${d[1]}</b><small>${d[2]}</small></div><small>↗</small></div>`).join('');
    return;
  }
  const s=[...nodes].sort((a,b)=>a[1].hop-b[1].hop||E[a[0]].name.localeCompare(E[b[0]].name));
  $('#lt').textContent='TRACKED LOCATIONS';$('#cnt').textContent=nodes.size;
  $('#list').innerHTML=s.map(([id,v])=>{const m=meta(id);return `<div class="it${id===sel?' on':''}" data-act="go" data-id="${id}"><i style="background:${col(v.hop)}"></i><div><b>${E[id].name}</b><small>${E[id].type}</small></div><em class="rk ${m.risk}">${m.risk}</em><small>H${v.hop}</small></div>`}).join('');
}
function cards(){
  const el=$('#cards');
  if(!sel){el.innerHTML='';lastSel=null;return}
  const e=E[sel],v=nodes.get(sel),m=meta(sel),has=kids(sel).length>0,c='card'+(sel!==lastSel?' in':'');lastSel=sel;
  const rows=[['LATITUDE',e.lat.toFixed(5)],['LONGITUDE',e.lng.toFixed(5)],['CONFIDENCE',`<div class="bar"><i style="width:${m.conf}%"></i></div>${m.conf}%`],['SOURCES',m.src],['LAST SEEN',m.seen],['ENTITY ID',e.id]];
  el.innerHTML=`
  <div class="${c}"><div class="hd">01 · OVERVIEW<span><button class="x" data-act="close" title="Close">✕</button></span></div>
    <h2>${e.name}</h2><div class="tags"><span class="tg">${e.type}</span><span class="tg">${e.cat}</span><span class="tg">${sel===root?'ROOT':'HOP '+v.hop}</span></div>
    <p class="mu">${e.desc}</p>
    <div class="acts"><button class="pri" data-act="${has?'col':'exp'}" data-id="${sel}">${has?'Collapse links':'Expand links'}</button><button data-act="mk" data-id="${sel}">Make root</button><button data-act="fly" data-id="${sel}">Focus map</button></div></div>
  <div class="${c}"><div class="hd">02 · GEO &amp; INTEL<span class="rk ${m.risk}">RISK ${m.risk}</span></div>
    <div class="mg">${rows.map(([a,b])=>`<div class="mc"><span>${a}</span><b>${b}</b></div>`).join('')}</div></div>
  <div class="${c}"><div class="hd">03 · RELATIONSHIPS<span>${A[sel].length}</span></div>
    <div class="rels">${A[sel].map(a=>`<button class="rel${nodes.has(a.to)?' on':''}" data-act="${nodes.has(a.to)?'go':'add'}" data-id="${a.to}" data-from="${sel}">${E[a.to].name}<small>${a.rel}</small></button>`).join('')||'<span class="mu">No links in this dataset.</span>'}</div></div>
  <div class="${c}"><div class="hd">04 · ACTIVITY LOG</div>
    <div id="log">${logs.slice(0,6).map(l=>`<div><time>${l.t}</time>${l.m}</div>`).join('')||'<p class="mu">Awaiting activity…</p>'}</div></div>`;
}
function render(fit){rMap(fit);kpis();list();cards()}
// ---- search + suggestions
let sh=[],si=-1;
const hideSug=()=>{$('#sug').hidden=true;si=-1};
function showSug(){
  const t=$('#q').value.trim().toLowerCase();
  sh=D.filter(d=>(cat==='All'||d[7]===cat)&&(!t||d[1].toLowerCase().includes(t)||d[2].toLowerCase().includes(t))).slice(0,8);
  $('#sug').innerHTML=sh.length?sh.map((d,i)=>`<div class="${i===si?'on':''}" data-act="start" data-id="${d[0]}">${d[1]}<small>${d[2]}</small></div>`).join(''):'<div><small>NO MATCH IN DEMO DATASET</small></div>';
  $('#sug').hidden=false;
}
$('#q').addEventListener('input',()=>{si=-1;showSug()});
$('#q').addEventListener('focus',showSug);
$('#q').addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!sh.length)return;si=(si+(e.key==='ArrowDown'?1:-1)+sh.length)%sh.length;showSug()}
  else if(e.key==='Enter')scan();else if(e.key==='Escape')hideSug()});
function scan(){const d=sh[Math.max(si,0)];if(!d){showSug();return}$('#q').value=d[1];hideSug();start(d[0])}
$('#go').onclick=()=>{showSug();scan()};
function chips(){$('#cats').innerHTML=['All','Cities','Landmarks','Nature'].map(c=>`<button class="chip${c===cat?' on':''}" data-act="cat" data-id="${c}">${c.toUpperCase()}</button>`).join('')}
document.addEventListener('click',ev=>{
  if(!ev.target.closest('.sbox'))hideSug();
  const b=ev.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act,id=b.dataset.id;
  if(act==='go'){sel=id;render([id]);map.flyTo([E[id].lat,E[id].lng],Math.max(map.getZoom(),9))}
  else if(act==='add'){const f=b.dataset.from;nodes.set(id,{hop:nodes.get(f).hop+1,parent:f});log(`LINK ${E[f].name} → ${E[id].name}`);sel=id;render(nb(id))}
  else if(act==='exp'){sel=id;expand(id);render(nb(id))}
  else if(act==='col'){sel=id;drop(id);log(`COLLAPSE ${E[id].name}`);render([id])}
  else if(act==='mk')start(id);
  else if(act==='fly')map.flyTo([E[id].lat,E[id].lng],12);
  else if(act==='close'){sel=null;render()}
  else if(act==='start'){$('#q').value=E[id].name;hideSug();start(id)}
  else if(act==='cat'){cat=id;chips();list();if(!$('#sug').hidden)showSug()}
});
// ---- toolbar
$('#back').onclick=()=>{if(root){sel=root;render();map.flyTo([E[root].lat,E[root].lng],10)}};
$('#fit').onclick=()=>{if(nodes.size)map.fitBounds(L.latLngBounds([...nodes.keys()].map(i=>[E[i].lat,E[i].lng])),{paddingTopLeft:[360,80],paddingBottomRight:[340,60]})};
$('#reroot').onclick=()=>{if(root)start(root)};
$('#clear').onclick=()=>{nodes.clear();root=sel=null;$('#q').value='';log('GRAPH CLEARED');render();map.setView([33.4,72.9],7)};
$('#exp').onclick=()=>{
  const data={root,entities:[...nodes].map(([id,v])=>({id,name:E[id].name,hop:v.hop,parent:v.parent,lat:E[id].lat,lng:E[id].lng,...meta(id)})),links:edges().map(([a,b,r])=>({source:a,target:b,relation:r}))};
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='atlas-graph.json';a.click();log('EXPORT atlas-graph.json');render();
};
setInterval(()=>$('#clock').textContent=new Date().toISOString().slice(0,19).replace('T',' ')+'Z',1000);
chips();log('SYSTEM READY · demo dataset loaded');render();
</script>
</body>
</html>
